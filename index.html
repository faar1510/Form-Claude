<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pesquisa de Integração</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #080b10;
    --surface:     #0e1420;
    --border:      #1a2236;
    --border-lit:  #243050;
    --green:       #00e676;
    --green-dim:   rgba(0,230,118,.15);
    --green-glow:  rgba(0,230,118,.35);
    --blue:        #2979ff;
    --blue-dim:    rgba(41,121,255,.12);
    --error:       #ff3d71;
    --text:        #dce6f5;
    --muted:       #5a6a88;
    --radius:      12px;
  }

  html, body {
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 0 0 48px;
  }

  /* ── BANNER HERO ─────────────────────────── */
  .hero {
    width: 100%;
    max-width: 540px;
    height: 190px;
    position: relative;
    overflow: hidden;
    background: #06090f;
    flex-shrink: 0;
  }

  /* grade de fundo */
  .hero-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(41,121,255,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(41,121,255,.07) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  /* linhas de scan */
  .hero-scan {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(0,230,118,.015) 3px,
      rgba(0,230,118,.015) 4px
    );
    pointer-events: none;
  }

  /* brilho central */
  .hero-glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 340px; height: 200px;
    background: radial-gradient(ellipse, rgba(41,121,255,.18) 0%, transparent 70%);
  }

  /* SVG científico */
  .hero-svg {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }

  /* texto hero */
  .hero-label {
    position: absolute;
    bottom: 16px; left: 0; right: 0;
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-size: .68rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--green);
    opacity: .7;
  }

  /* tag de canto */
  .hero-tag {
    position: absolute;
    top: 14px; right: 16px;
    font-family: 'Space Mono', monospace;
    font-size: .6rem;
    color: var(--blue);
    opacity: .6;
    letter-spacing: .1em;
  }

  /* ── CARD ─────────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 20px 20px;
    width: 100%;
    max-width: 540px;
    padding: 32px 36px 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }

  h1 {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -.4px;
    margin-bottom: 28px;
    color: var(--text);
    border-left: 3px solid var(--green);
    padding-left: 14px;
  }

  /* ── FIELDS ──────────────────────────────── */
  .field { margin-bottom: 20px; }

  label {
    display: block;
    font-size: .72rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .1em;
    margin-bottom: 8px;
    font-family: 'Space Mono', monospace;
  }

  input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border-lit);
    border-radius: var(--radius);
    padding: 13px 16px;
    font-size: .95rem;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input[type="text"]::placeholder { color: var(--muted); opacity: .5; }
  input[type="text"]:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px var(--green-dim);
  }

  /* ── SIM/NÃO TOGGLE ─────────────────────── */
  .toggle-group {
    display: flex;
    gap: 10px;
  }

  .toggle-group input[type="radio"] { display: none; }

  .toggle-group label {
    flex: 1;
    text-align: center;
    padding: 12px 0;
    border: 1px solid var(--border-lit);
    border-radius: var(--radius);
    cursor: pointer;
    font-size: .9rem;
    font-weight: 600;
    font-family: 'Space Grotesk', sans-serif;
    color: var(--muted);
    text-transform: none;
    letter-spacing: .04em;
    transition: all .18s;
    background: var(--bg);
    margin-bottom: 0;
  }

  .toggle-group input[type="radio"]:checked + label {
    border-color: var(--green);
    background: var(--green-dim);
    color: var(--green);
    box-shadow: 0 0 0 1px var(--green);
  }

  .toggle-group label:hover {
    border-color: var(--border-lit);
    color: var(--text);
    background: rgba(255,255,255,.03);
  }

  /* ── DIVIDER ─────────────────────────────── */
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 28px 0;
  }

  /* ── BOTÃO ENVIAR ─────────────────────────── */
  .btn-submit {
    width: 100%;
    padding: 15px;
    background: var(--green);
    color: #040a05;
    font-weight: 700;
    font-size: 1rem;
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: .06em;
    text-transform: uppercase;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: opacity .2s, transform .1s, box-shadow .2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 0 24px var(--green-glow);
  }
  .btn-submit:hover   { opacity: .88; box-shadow: 0 0 36px var(--green-glow); }
  .btn-submit:active  { transform: scale(.98); }
  .btn-submit:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(4,10,5,.3);
    border-top-color: #040a05;
    border-radius: 50%;
    animation: spin .6s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── TELA DE CONFIRMAÇÃO ─────────────────── */
  .confirm-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 32px 36px 36px;
    animation: fadeIn .5s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .skull-wrap {
    width: 200px; height: 200px;
    margin-bottom: 28px;
    position: relative;
  }

  /* caveira SVG ultra-realista gerada inline */
  .skull-wrap svg {
    width: 100%; height: 100%;
    filter: drop-shadow(0 0 18px rgba(0,230,118,.5));
  }

  .confirm-title {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--green);
    letter-spacing: -.3px;
    margin-bottom: 8px;
  }

  .confirm-sub {
    font-size: .88rem;
    color: var(--muted);
    line-height: 1.6;
    max-width: 280px;
  }

  /* ── TOAST ──────────────────────────────── */
  .toast {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #111927;
    border: 1px solid var(--border-lit);
    border-radius: 12px;
    padding: 13px 22px;
    font-size: .86rem;
    color: var(--text);
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    display: flex; align-items: center; gap: 10px;
    opacity: 0;
    transition: all .32s cubic-bezier(.4,0,.2,1);
    z-index: 999;
    max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: rgba(255,61,113,.35); }

  @media (max-width: 540px) {
    .card, .confirm-screen { padding: 26px 20px 28px; }
    .hero { height: 160px; }
  }
</style>
</head>
<body>

    </svg>
  </div>

  <div class="hero-tag">v2.4.1 · ACTIVE</div>
  <div class="hero-label">Instituto de Pesquisa e Integração</div>
</div>

<!-- ══ CARD FORMULÁRIO ════════════════════════ -->
<div class="card" id="formCard">
  <h1>Pesquisa de Integração</h1>

  <form id="mainForm" onsubmit="submitForm(event)">

    <div class="field">
      <label>Nome Artístico</label>
      <input type="text" id="nome" placeholder="Como você é conhecido(a)" required />
    </div>

    <div class="field">
      <label>Usa IA?</label>
      <div class="toggle-group">
        <input type="radio" name="usaIA" id="ia_sim" value="Sim" required />
        <label for="ia_sim">Sim</label>
        <input type="radio" name="usaIA" id="ia_nao" value="Não" />
        <label for="ia_nao">Não</label>
      </div>
    </div>

    <div class="field">
      <label>Usa Rede Social?</label>
      <div class="toggle-group">
        <input type="radio" name="usaRedeSocial" id="rs_sim" value="Sim" required />
        <label for="rs_sim">Sim</label>
        <input type="radio" name="usaRedeSocial" id="rs_nao" value="Não" />
        <label for="rs_nao">Não</label>
      </div>
    </div>

    <hr class="divider" />

    <button type="submit" class="btn-submit" id="submitBtn">

  </form>
</div>

<!-- ══ TOAST ═════════════════════════════════ -->
<div class="toast" id="toast">
  <span id="toastIcon"></span>
  <span id="toastMsg"></span>
</div>

<script>
  // ════════════════════════════════════════════
  //  ▼▼▼  COLE AQUI A URL DO SEU APPS SCRIPT  ▼▼▼
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwIqp_J67lvTMYh3grf8dWpxG8TRJAHT_sct6HVd0ZwfLYN2wslWCdFqQM_bvx3tIvU/exec';
  // ════════════════════════════════════════════

  let geoData = { latitude: 'N/D', longitude: 'N/D', cidade: 'N/D' };

  // ── GEOLOCALIZAÇÃO SILENCIOSA ────────────────
  function initGeo() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        geoData.latitude  = pos.coords.latitude.toFixed(6);
        geoData.longitude = pos.coords.longitude.toFixed(6);
        try {
          const r = await fetch(
            `https://nominatim.openstreetmap.org/reverse?lat=${geoData.latitude}&lon=${geoData.longitude}&format=json`,
            { headers: { 'Accept-Language': 'pt-BR' } }
          );
          const j = await r.json();
          const a = j.address || {};
          geoData.cidade = a.city || a.town || a.village || a.county || 'N/D';
        } catch { /* silencioso */ }
      },
      () => { /* erro silencioso */ },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  // ── ENVIO ─────────────────────────────────────
  async function submitForm(e) {
    e.preventDefault();

    if (!ENDPOINT || ENDPOINT === 'COLE_AQUI_A_URL_DO_APPS_SCRIPT') {
      showToast('⚠️ Configure o ENDPOINT no código HTML antes de usar.', 'error');
      return;
    }

    const iaVal = document.querySelector('input[name="usaIA"]:checked');
    const rsVal = document.querySelector('input[name="usaRedeSocial"]:checked');

    if (!iaVal || !rsVal) {
      showToast('⚠️ Responda todas as perguntas antes de enviar.', 'error');
      return;
    }

    setLoading(true);

    const payload = {
      nome:      document.getElementById('nome').value.trim(),
      telefone:  iaVal.value,
      endereco:  rsVal.value,
      latitude:  geoData.latitude,
      longitude: geoData.longitude,
      cidade:    geoData.cidade
    };

    try {
      await fetch(ENDPOINT, {
        method:  'POST',
        mode:    'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload)
      });
      showConfirm();
    } catch (err) {
      showToast('❌ Falha no envio. Verifique sua conexão.', 'error');
      console.error(err);
    } finally {
      setLoading(false);
    }
  }

  function showConfirm() {
    document.getElementById('heroTop').style.display  = 'none';
    document.getElementById('formCard').style.display = 'none';
    const cs = document.getElementById('confirmScreen');
    cs.style.display = 'flex';
    // scroll suave ao topo
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function setLoading(on) {
    document.getElementById('submitBtn').disabled = on;
    document.getElementById('btnText').style.display  = on ? 'none' : 'inline';
    document.getElementById('spinner').style.display  = on ? 'block' : 'none';
  }

  let toastTimer;
  function showToast(msg, type = 'error') {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent  = msg;
    document.getElementById('toastIcon').textContent = type === 'error' ? '⚠️' : '✅';
    t.className = `toast ${type}`;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 4500);
  }

  // ── INIT ──────────────────────────────────────
  initGeo();
</script>
</body>
</html>
